<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description"
        content="Modern PWA for Yu-Gi-Oh card management with voice recognition, price checking, pack opening, and collection tracking. Features 7 themes, offline support, and multiplatform compatibility.">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VoxRip">

    <title>VoxRip - Yu-Gi-Oh Card Manager</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="src/assets/icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="src/assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="src/assets/icons/icon-192.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="src/css/main.css">

    <link rel="stylesheet" href="src/css/responsive.css">
    <link rel="stylesheet" href="src/css/utilities.css">
    <link rel="stylesheet" href="src/css/themes.css">
    <link rel="stylesheet" href="src/css/layouts.css">
    <link rel="stylesheet" href="src/css/sidebar.css">
    <link rel="stylesheet" href="src/css/settings.css">
    <link rel="stylesheet" href="src/css/theme-settings.css">
    <link rel="stylesheet" href="src/css/collection.css?v=2.1.0">
    <link rel="stylesheet" href="src/css/pack-opening-compact.css">
    <link rel="stylesheet" href="src/css/animations.css">
    <link rel="stylesheet" href="src/css/accessibility.css">

    <!-- Preload critical resources -->
    <link rel="preload" href="src/js/app.js" as="script" crossorigin="anonymous">
    <link rel="preload" href="src/js/voice/VoiceEngine.js" as="script" crossorigin="anonymous">

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="importmap" id="supabase-importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.0?bundle"
      }
    }
    </script>
</head>

<body>
    <!-- Skip to Content Link (for keyboard navigation) -->
    <a href="#main-content" class="skip-to-content">Skip to main content</a>

    <!-- App Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="app-logo">
                <h1>VoxRip</h1>
                <div class="loading-spinner"></div>
            </div>
            <p class="loading-text">Initializing application...</p>
            <div class="loading-progress">
                <div class="progress-bar" id="loading-progress"></div>
            </div>
        </div>
    </div>

    <!-- Main Application -->
    <div id="app" class="app hidden">
        <!-- Mobile Sidebar Toggle -->
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar navigation">
            <i data-lucide="menu"></i>
        </button>

        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
            <!-- Sidebar Header -->
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <span>🃏</span>
                    <span>VoxRip</span>
                </div>
            </div>

            <!-- Sidebar Navigation (will be populated by Sidebar.js in Phase 4) -->
            <nav class="sidebar-nav" id="sidebar-nav" role="menu" aria-label="Navigation menu">
                <!-- Navigation items will be added in Phase 4 -->
            </nav>

            <!-- Sidebar Footer -->
            <div class="sidebar-footer">
                <!-- Auth UI Container -->
                <div id="auth-container"></div>
                <span id="app-version">v2.0.0</span>
            </div>
        </aside>

        <!-- Sidebar Overlay for mobile -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Main Content Area -->
        <main class="main-content" id="main-content" role="main" aria-label="Main content">
            <!-- Page Header Removed -->

            <!-- Page Container (dynamic content) -->
            <div class="page-container" id="page-container">
                <!-- Content will be dynamically loaded by router -->
                <div class="page-content" id="page-placeholder">
                    <h2 class="text-white text-xl mb-2">Welcome to VoxRip</h2>
                    <p class="text-secondary">Content loads dynamically once the application router initializes.</p>
                </div>
            </div>
        </main>

        <!-- Status Bar -->
        <footer class="status-bar">
            <div class="status-item">
                <span id="app-status">Ready</span>
            </div>
            <div class="status-item">
                <span id="connection-status">Online</span>
            </div>
        </footer>
    </div>

    <!-- Main Content Area -->

    <!-- Floating Voice Submenu (visible only during voice recognition) -->
    <div id="floating-voice-submenu" class="floating-voice-submenu hidden">
        <button id="floating-stop-voice-btn" class="submenu-btn" title="Stop Voice Recognition">
            <span class="btn-icon">⏹️</span>
        </button>
        <button id="floating-settings-btn" class="submenu-btn" title="Settings">
            <span class="btn-icon">⚙️</span>
        </button>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <!-- Modals will be populated dynamically -->
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container">
        <!-- Toasts will be populated dynamically -->
    </div>

    <!-- Runtime configuration (optional, ignored if missing) -->
    <script type="module">
        (async () => {
            try {
                const runtimeModule = await import('./runtime-env.js');
                const runtimeEnv = runtimeModule?.default || runtimeModule?.env || runtimeModule;
                if (runtimeEnv && typeof runtimeEnv === 'object') {
                    window.__ENV__ = { ...(window.__ENV__ || {}), ...runtimeEnv };
                }
            } catch (error) {
                if (error?.code !== 'ERR_MODULE_NOT_FOUND') {
                    console.info('[RuntimeEnv] runtime-env.js could not be loaded:', error);
                } else {
                    console.info('[RuntimeEnv] runtime-env.js not found. Using default environment configuration.');
                }
            }
        })();
    </script>

    <!-- Local dev: proactively unregister any previously installed service workers on localhost to avoid stale assets -->
    <script>
        if (['localhost', '127.0.0.1'].includes(window.location.hostname) && 'serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then((regs) => {
                regs.forEach((reg) => reg.unregister());
            });
            if (window.caches && caches.keys) {
                caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
            }
        }
    </script>

    <!-- Scripts -->
    <script type="module" src="src/js/app.js"></script>

    <!-- Service Worker Registration (disabled locally to prevent stale cache issues) -->
    <script>
        const swDisabled = typeof window !== 'undefined' && window.__ENV__?.VITE_DISABLE_SW;
        const isLocalhost = typeof window !== 'undefined' && ['localhost', '127.0.0.1'].includes(window.location.hostname);

        if ('serviceWorker' in navigator && !swDisabled && !isLocalhost) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('[SW] Service Worker registered successfully:', registration);
                    })
                    .catch(error => {
                        console.log('[SW] Service Worker registration failed:', error);
                    });
            });
        } else {
            console.info('[SW] Registration skipped (local dev or VITE_DISABLE_SW=true).');
        }
    </script>

    <!-- Router & Sidebar Integration (Phase 5) -->
    <script type="module">
        console.log('Index.html module script loaded (TIMESTAMP: ' + Date.now() + ')');
        import config from './src/lib/config.js';
        import Router from './src/utils/Router.js';
        import Sidebar from './src/components/Sidebar.js';

        // Import all page components
        import DashboardPage from './src/pages/DashboardPage.js';
        import PriceCheckerPage from './src/pages/PriceCheckerPage.js';
        import PackOpeningPage from './src/pages/PackOpeningPage.js';
        import CollectionPage from './src/pages/CollectionPageV2.js';
        import VoiceTrainingPage from './src/pages/VoiceTrainingPage.js';
        import AchievementsPage from './src/pages/AchievementsPage.js';
        import LeaderboardPage from './src/pages/LeaderboardPage.js';
        import SettingsPage from './src/pages/SettingsPage.js';
        import ThemeSettingsPage from './src/pages/ThemeSettingsPage.js';
        import AdminPage from './src/pages/AdminPage.js';
        import RarityAdminPage from './src/pages/RarityAdminPage.js';

        // Initialize router and sidebar when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Router
            const router = new Router({
                defaultRoute: 'dashboard',
                notFoundRoute: 'dashboard'
            });

            const pageContainer = document.getElementById('page-container');
            const pageTitle = document.getElementById('page-title');

            // Register all routes before initialization so deep links resolve
            router.register('dashboard', DashboardPage);
            router.register('pack-opening', PackOpeningPage);
            router.register('price-checker', PriceCheckerPage);
            router.register('collection', CollectionPage);
            router.register('training', VoiceTrainingPage);
            router.register('achievements', AchievementsPage);
            router.register('leaderboards', LeaderboardPage);
            router.register('settings', SettingsPage);
            router.register('theme', ThemeSettingsPage);
            router.register('admin', AdminPage);
            router.register('rarity-admin', RarityAdminPage, 'Rarity Vault');

            router.initialize(pageContainer, pageTitle);

            console.log('Router initialized with', router.getRoutes().length, 'routes');

            // Initialize sidebar component FIRST
            const sidebar = new Sidebar({
                container: document.getElementById('sidebar'),
                defaultActive: 'dashboard',
                onNavigate: (navId) => {
                    console.log('Sidebar navigation to:', navId);
                    // Use router to navigate
                    router.navigate(navId);
                }
            });

            // Listen for route changes to update sidebar active state
            router.addEventListener('route:change', (data) => {
                if (sidebar) {
                    sidebar.setActive(data.route);
                }
            });

            // Mobile sidebar toggle button
            const sidebarToggle = document.getElementById('sidebar-toggle');
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', () => {
                    sidebar.toggle();
                });
            }

            // Sidebar overlay click to close
            const sidebarOverlay = document.getElementById('sidebar-overlay');
            if (sidebarOverlay) {
                sidebarOverlay.addEventListener('click', () => {
                    sidebar.close();
                });
            }

            // Close sidebar on escape key (mobile)
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && sidebar.isOpen && sidebar.isMobile) {
                    sidebar.close();
                }
            });

            // Store instances globally for debugging and access
            window.router = router;
            // Avoid overwriting window.sidebar if it's read-only, but try anyway or use app.sidebar
            try { window.sidebar = sidebar; } catch (e) { console.warn('Could not set window.sidebar', e); }

            if (window.app) {
                window.app.sidebar = sidebar;
                console.log('Sidebar attached to window.app');
            } else {
                console.warn('window.app not found when attaching sidebar');
            }

            console.log('Router and Sidebar initialized successfully');
        });
    </script>
</body>

</html>
